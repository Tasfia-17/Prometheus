name: Prometheus Performance Test

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'demos/**'
  issue_comment:
    types: [created]

jobs:
  performance-test:
    # Trigger on PR events OR on comment "@prometheus test" on a PR
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@prometheus test'))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -y k6

      - name: Detect changed demo app
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- demos/ 2>/dev/null || echo "")
          if echo "$CHANGED" | grep -q "demos/midas-bank"; then
            echo "app_type=midas" >> $GITHUB_OUTPUT
            echo "k6_script=k6/midas-bank-test.js" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | grep -q "demos/calliope-books"; then
            echo "app_type=calliope" >> $GITHUB_OUTPUT
            echo "k6_script=k6/calliope-books-test.js" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | grep -q "demos/hestia-eats"; then
            echo "app_type=hestia" >> $GITHUB_OUTPUT
            echo "k6_script=k6/hestia-eats-test.js" >> $GITHUB_OUTPUT
          else
            echo "app_type=" >> $GITHUB_OUTPUT
          fi

      - name: Run Prometheus performance test
        if: steps.detect.outputs.app_type != ''
        id: run_test
        run: |
          chmod +x scripts/run-prometheus-test.sh
          ./scripts/run-prometheus-test.sh \
            "${{ steps.detect.outputs.k6_script }}" \
            "${{ steps.detect.outputs.app_type }}" > /tmp/prometheus-report.md 2>&1 || true
          echo "report_exists=$([ -f /tmp/prometheus-report.md ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Post report as PR comment
        if: steps.detect.outputs.app_type != '' && steps.run_test.outputs.report_exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/prometheus-report.md', 'utf8');
            const pr_number = context.payload.pull_request?.number ||
                              context.payload.issue?.number;
            if (!pr_number) { console.log('No PR number found'); return; }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: `## 🔥 Prometheus Performance Report\n\n${report}\n\n---\n*Generated by [Prometheus](https://github.com/Tasfia-17/Prometheus) — AI performance testing agent powered by IBM Bob*`
            });

      - name: No demo changes detected
        if: steps.detect.outputs.app_type == ''
        run: echo "No demo app changes detected — skipping performance test."
